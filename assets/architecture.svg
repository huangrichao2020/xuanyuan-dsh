<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 920 540">
  <defs>
    <linearGradient id="glow" x1="0" x2="0" y1="0" y2="1">
      <stop offset="0%" stop-color="#39d0d8" stop-opacity="0.25"/>
      <stop offset="100%" stop-color="#39d0d8" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="gold" x1="0" x2="1" y1="0" y2="1">
      <stop offset="0%" stop-color="#39d0d8"/>
      <stop offset="100%" stop-color="#e8b04b"/>
    </linearGradient>
    <filter id="shadow">
      <feDropShadow dx="0" dy="2" stdDeviation="3" flood-color="#000" flood-opacity="0.4"/>
    </filter>
    <marker id="arrow" markerWidth="10" markerHeight="10" refX="8" refY="3" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,6 L9,3 z" fill="#39d0d8"/>
    </marker>
  </defs>
  <rect width="920" height="540" fill="#0b0e16"/>
  <!-- title -->
  <text x="460" y="38" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="20" font-weight="700" fill="url(#gold)">玄源架构：三层，各司其职</text>
  <text x="460" y="58" text-anchor="middle" font-family="ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, sans-serif" font-size="12" fill="#8b949e">每轮从状态读取 → 注入 system prompt</text>

  <!-- 主循环 -->
  <g transform="translate(120,260)" filter="url(#shadow)">
    <circle r="72" fill="#111820" stroke="#39d0d8" stroke-width="2"/>
    <circle r="56" fill="#0f1620" stroke="#39d0d8" stroke-width="1" stroke-opacity="0.5"/>
    <text x="0" y="-10" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="16" font-weight="600" fill="#e8b04b">dsh</text>
    <text x="0" y="12" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="14" fill="#c9d1d9">agent-loop</text>
    <text x="0" y="30" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="10" fill="#8b949e">主循环 · 最底层</text>
  </g>

  <!-- 插件层 -->
  <g transform="translate(320,90)" filter="url(#shadow)">
    <rect width="500" height="110" rx="8" fill="#111820" stroke="#2a3447" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="110" rx="4" fill="#39d0d8"/>
    <text x="20" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#39d0d8">① 插件层  @xuanyuan/dsh-xuanyuan</text>
    <text x="20" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c9d1d9">每轮读取 ~/.dsh/xuanyuan/state.json，把 境界 / 心境 / 道韵 + 运行守则</text>
    <text x="20" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c9d1d9">注入 system prompt 顶部（systemPrompt.section）</text>
    <text x="20" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8b949e">只读 · 零副作用 · 异常降级</text>
  </g>

  <!-- 技能层 -->
  <g transform="translate(320,215)" filter="url(#shadow)">
    <rect width="500" height="110" rx="8" fill="#111820" stroke="#2a3447" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="110" rx="4" fill="#e8b04b"/>
    <text x="20" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#e8b04b">② 技能层  xuanyuan-*（按需加载）</text>
    <text x="20" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c9d1d9">xuanyuan · xuanyuan-realms · xuanyuan-rhythm</text>
    <text x="20" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c9d1d9">xuanyuan-architecture · governance · humanistic · emergence-*</text>
    <text x="20" y="86" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c9d1d9">xuanyuan-instance · four-direction</text>
    <text x="20" y="102" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8b949e">操作手册 · 纯文档 · 触发式加载</text>
  </g>

  <!-- 引擎层 -->
  <g transform="translate(320,340)" filter="url(#shadow)">
    <rect width="500" height="110" rx="8" fill="#111820" stroke="#2a3447" stroke-width="1"/>
    <rect x="0" y="0" width="6" height="110" rx="4" fill="#a57af5"/>
    <text x="20" y="28" font-family="ui-sans-serif, system-ui, sans-serif" font-size="15" font-weight="600" fill="#a57af5">③ 引擎层  xuanyuan-mcp（可选）</text>
    <text x="20" y="50" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c9d1d9">xuanyuan_state / advance / rhythm / antibloat / memory</text>
    <text x="20" y="68" font-family="ui-sans-serif, system-ui, sans-serif" font-size="12" fill="#c9d1d9">显式驱动境界进阶、进入道韵、评估抗膨胀、存取经验包</text>
    <text x="20" y="92" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8b949e">可写 · 通过 mcp-client 桥接入 dsh</text>
  </g>

  <!-- 箭头 -->
  <line x1="200" y1="175" x2="310" y2="145" stroke="#39d0d8" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="270" x2="310" y2="270" stroke="#e8b04b" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="200" y1="365" x2="310" y2="395" stroke="#a57af5" stroke-width="1.5" marker-end="url(#arrow)"/>
  <line x1="570" y1="200" x2="570" y2="440" stroke="#39d0d8" stroke-width="1" stroke-dasharray="4 4" marker-end="url(#arrow)"/>
  <line x1="690" y1="450" x2="720" y2="450" stroke="#a57af5" stroke-width="1" marker-end="url(#arrow)"/>

  <!-- 状态文件 -->
  <g transform="translate(450,460)" filter="url(#shadow)">
    <rect x="0" y="0" width="270" height="46" rx="6" fill="#0f1620" stroke="#39d0d8" stroke-width="1"/>
    <text x="135" y="20" text-anchor="middle" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" fill="#c9d1d9">~/.dsh/xuanyuan/state.json</text>
    <text x="135" y="36" text-anchor="middle" font-family="ui-sans-serif, system-ui, sans-serif" font-size="11" fill="#8b949e">境界 / 心境 / 道韵 / 经验包 持久化</text>
  </g>
</svg>
